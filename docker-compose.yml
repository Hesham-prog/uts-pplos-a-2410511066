version: '3.8'

services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - employee-service
      - attendance-service

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db-auth
      - DB_USER=root
      - DB_PASS=secret
      - DB_NAME=auth_db

  employee-service:
    build: ./services/employee-service
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db-employee
      - DB_PORT=3306
      - DB_DATABASE=employee_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret

  attendance-service:
    build: ./services/attendance-service
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=db-attendance
      - DB_USER=root
      - DB_PASS=secret
      - DB_NAME=attendance_db
      - EMPLOYEE_SERVICE_URL=http://employee-service:8000

  db-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: auth_db

  db-employee:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: employee_db

  db-attendance:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: attendance_db
